<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SSM登录注册演示</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
        }
        .container {
            background: white;
            border-radius: 20px;
            box-shadow: 0 20px 40px rgba(0,0,0,0.1);
            overflow: hidden;
            width: 400px;
            max-width: 90%;
        }
        .tabs {
            display: flex;
            background: #f5f5f5;
        }
        .tab {
            flex: 1;
            text-align: center;
            padding: 15px;
            cursor: pointer;
            font-weight: bold;
            color: #666;
            transition: all 0.3s;
        }
        .tab.active {
            background: white;
            color: #667eea;
            border-bottom: 3px solid #667eea;
        }
        .form-container {
            padding: 30px;
        }
        .form-group {
            margin-bottom: 20px;
        }
        .form-group label {
            display: block;
            margin-bottom: 8px;
            color: #333;
            font-weight: 500;
        }
        .form-group input {
            width: 100%;
            padding: 12px 15px;
            border: 2px solid #e1e1e1;
            border-radius: 8px;
            font-size: 16px;
            transition: border-color 0.3s;
        }
        .form-group input:focus {
            outline: none;
            border-color: #667eea;
        }
        .btn {
            width: 100%;
            padding: 12px;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            border: none;
            border-radius: 8px;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
            transition: transform 0.3s, box-shadow 0.3s;
        }
        .btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 5px 15px rgba(102, 126, 234, 0.4);
        }
        .btn:active {
            transform: translateY(0);
        }
        .message {
            margin-top: 15px;
            padding: 10px;
            border-radius: 8px;
            text-align: center;
            display: none;
        }
        .message.success {
            background: #d4edda;
            color: #155724;
            border: 1px solid #c3e6cb;
        }
        .message.error {
            background: #f8d7da;
            color: #721c24;
            border: 1px solid #f5c6cb;
        }
        .form-panel {
            display: none;
        }
        .form-panel.active {
            display: block;
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="tabs">
            <div class="tab active" data-tab="login">登录</div>
            <div class="tab" data-tab="register">注册</div>
        </div>
        <div class="form-container">
            <!-- 登录表单 -->
            <div class="form-panel active" id="login-panel">
                <form id="loginForm">
                    <div class="form-group">
                        <label for="login-username">用户名</label>
                        <input type="text" id="login-username" name="username" placeholder="请输入用户名" required>
                    </div>
                    <div class="form-group">
                        <label for="login-password">密码</label>
                        <input type="password" id="login-password" name="password" placeholder="请输入密码" required>
                    </div>
                    <button type="submit" class="btn">登录</button>
                </form>
            </div>
            <!-- 注册表单 -->
            <div class="form-panel" id="register-panel">
                <form id="registerForm">
                    <div class="form-group">
                        <label for="reg-username">用户名</label>
                        <input type="text" id="reg-username" name="username" placeholder="请输入用户名" required>
                    </div>
                    <div class="form-group">
                        <label for="reg-password">密码</label>
                        <input type="password" id="reg-password" name="password" placeholder="请输入密码" required>
                    </div>
                    <div class="form-group">
                        <label for="reg-email">邮箱（选填）</label>
                        <input type="email" id="reg-email" name="email" placeholder="请输入邮箱">
                    </div>
                    <button type="submit" class="btn">注册</button>
                </form>
            </div>
            <!-- 提示消息 -->
            <div id="message" class="message"></div>
        </div>
    </div>

    <script>
        // 页面加载完成后执行
        document.addEventListener('DOMContentLoaded', function() {
            // 选项卡切换
            const tabs = document.querySelectorAll('.tab');
            const panels = document.querySelectorAll('.form-panel');
            const messageDiv = document.getElementById('message');

            tabs.forEach(tab => {
                tab.addEventListener('click', function() {
                    const targetTab = this.dataset.tab;

                    // 切换激活状态
                    tabs.forEach(t => t.classList.remove('active'));
                    this.classList.add('active');

                    // 切换面板
                    panels.forEach(p => p.classList.remove('active'));
                    document.getElementById(targetTab + '-panel').classList.add('active');

                    // 隐藏提示消息
                    messageDiv.style.display = 'none';
                });
            });

            // 显示提示消息
            function showMessage(text, type) {
                messageDiv.textContent = text;
                messageDiv.className = 'message ' + type;
                messageDiv.style.display = 'block';
                setTimeout(() => {
                    messageDiv.style.display = 'none';
                }, 3000);
            }

            // 登录表单提交
            document.getElementById('loginForm').addEventListener('submit', function(e) {
                e.preventDefault();

                const username = document.getElementById('login-username').value.trim();
                const password = document.getElementById('login-password').value.trim();

                if (!username || !password) {
                    showMessage('用户名和密码不能为空', 'error');
                    return;
                }

                // 使用fetch API发送Ajax请求
                fetch('/ssm-login-demo/user/login', {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json'
                    },
                    body: JSON.stringify({
                        username: username,
                        password: password
                    })
                })
                .then(response => response.json())
                .then(data => {
                    if (data.code === 200) {
                        showMessage('登录成功！欢迎，' + data.data.username, 'success');
                        document.getElementById('loginForm').reset();
                    } else {
                        showMessage('登录失败：' + data.message, 'error');
                    }
                })
                .catch(error => {
                    console.error('Error:', error);
                    showMessage('网络错误，请稍后重试', 'error');
                });
            });

            // 注册表单提交
            document.getElementById('registerForm').addEventListener('submit', function(e) {
                e.preventDefault();

                const username = document.getElementById('reg-username').value.trim();
                const password = document.getElementById('reg-password').value.trim();
                const email = document.getElementById('reg-email').value.trim();

                if (!username || !password) {
                    showMessage('用户名和密码不能为空', 'error');
                    return;
                }

                if (password.length < 6) {
                    showMessage('密码长度不能少于6位', 'error');
                    return;
                }

                // 使用fetch API发送Ajax请求
                fetch('/ssm-login-demo/user/register', {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json'
                    },
                    body: JSON.stringify({
                        username: username,
                        password: password,
                        email: email || null
                    })
                })
                .then(response => response.json())
                .then(data => {
                    if (data.code === 200) {
                        showMessage('注册成功！请登录', 'success');
                        document.getElementById('registerForm').reset();
                        // 自动切换到登录选项卡
                        document.querySelector('[data-tab="login"]').click();
                    } else {
                        showMessage('注册失败：' + data.message, 'error');
                    }
                })
                .catch(error => {
                    console.error('Error:', error);
                    showMessage('网络错误，请稍后重试', 'error');
                });
            });
        });
    </script>
</body>
</html>
